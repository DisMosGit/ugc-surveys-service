[project]
name = "ugc-surveys-service"
version = "0.1.0"
description = "UGC survey service built with Django"
readme = "README.md"
authors = [
    { name = "DisMosGit", email = "DisSurgu@ya.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "granian[reload]>=2.8.4",
    "orjson>=3.13.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-ulid>=4.0.1",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
    "watchfiles>=1.3.0",
]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "DJ",     # flake8-django
    "UP",     # pyupgrade
    "PL",     # Pylint
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]
"*/migrations/*.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
files = ["manage.py", "config", "core", "accounts", "surveys", "answers", "analytics"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.admin"]
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = ["core.models"]
disable_error_code = ["type-arg"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.basedpyright]
typeCheckingMode = "standard"
